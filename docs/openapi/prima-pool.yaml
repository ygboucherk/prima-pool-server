openapi: 3.1.0
info:
  title: prima-pool control plane API
  version: 0.3.0
  description: >
    Negotiation protocol for the prima-pool inference pool. Accounts register with a username and
    password, create scoped API keys (worker / user), and worker devices log in with a worker key
    to join WireGuard clusters. User-scoped usage/log endpoints let an account view its own
    inference history and per-model statistics (see docs/protocol/usage-and-accounting.md).
servers:
  - url: https://pool.example.com/v1
tags:
  - name: accounts
    description: Account registration, login, and scoped API key management.
  - name: admin
    description: Admin-only account management (permissions, bans).
  - name: workers
    description: Worker device registration, state, heartbeat.
  - name: clusters
    description: Cluster config and readiness.
  - name: inference
    description: OpenAI-compatible inference proxy to live clusters.

paths:
  /accounts/register:
    post:
      tags: [accounts]
      operationId: registerAccount
      summary: Register an account (username + password).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAccountRequest"
      responses:
        "201":
          description: Account registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /accounts/login:
    post:
      tags: [accounts]
      operationId: login
      summary: Log in and receive a short-lived session token for key management.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /accounts/{account_id}/password:
    post:
      tags: [accounts]
      operationId: changePassword
      summary: Change the account's password (requires the current password).
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed. Existing API keys and sessions remain valid.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{account_id}/keys:
    post:
      tags: [accounts]
      operationId: createKey
      summary: Create a scoped API key (worker or user).
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateKeyRequest"
      responses:
        "201":
          description: Key created (secret shown once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [accounts]
      operationId: listKeys
      summary: List the account's API keys (without secrets).
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: List of keys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{account_id}/dashboard:
    get:
      tags: [accounts]
      operationId: accountDashboard
      summary: Account-scoped dashboard data (workers + keys).
      description: >
        Used by the static GUI at /ui. Returns the account's workers and API
        keys. Auth: the account's session token (from /accounts/login).
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: Dashboard data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: { type: string }
                  username: { type: string }
                  is_admin: { type: boolean }
                  can_work: { type: boolean }
                  can_use: { type: boolean }
                  banned: { type: boolean }
                  balance:
                    type: string
                    description: Account balance in 10^-12 token units (decimal string).
                  workers:
                    type: array
                    items:
                      type: object
                      properties:
                        worker_id: { type: string }
                        model: { type: string }
                        status:
                          type: string
                          enum: [registered, waitlisted, assigned]
                        online: { type: boolean }
                        memory_mb: { type: integer }
                        cluster_id: { type: string }
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        key_id: { type: string }
                        name: { type: string }
                        scope: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{account_id}/keys/{key_id}:
    delete:
      tags: [accounts]
      operationId: revokeKey
      summary: Revoke a scoped API key.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/KeyId"
      responses:
        "204":
          description: Key revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{account_id}/balance:
    get:
      tags: [accounts]
      operationId: getBalance
      summary: Return the account's own balance.
      description: >
        Auth: user-scoped API key OR the account session token. The balance is
        an integer in 10^-12 token units, serialized as a decimal string.
      security:
        - sessionAuth: []
        - userKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      responses:
        "200":
          description: The account's balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /accounts/{account_id}/balance/events:
    get:
      tags: [accounts]
      operationId: listBalanceEvents
      summary: Return the account's own balance events, newest first.
      description: >
        Auth: user-scoped API key OR the account session token. The acting
        admin's identity is NOT exposed here (admin-only detail).
      security:
        - sessionAuth: []
        - userKeyAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: List of balance events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BalanceEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/permissions:
    get:
      tags: [admin]
      operationId: getPermissionState
      summary: Current pool-wide permissionless switches (admin only).
      security:
        - sessionAuth: []
      responses:
        "200":
          description: The two permissionless switches.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/accounts:
    get:
      tags: [admin]
      operationId: listAccounts
      summary: List all accounts with their permission flags (admin only).
      security:
        - sessionAuth: []
      responses:
        "200":
          description: All accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAccount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/accounts/{account_id}:
    patch:
      tags: [admin]
      operationId: updateAccountPermissions
      summary: Toggle one account's permission flags (admin only).
      description: >
        Each present field sets the account's value; absent fields are left
        untouched. Demoting the last remaining admin is rejected (409).
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountPermissionsRequest"
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /admin/accounts/{account_id}/balance:
    put:
      tags: [admin]
      operationId: setBalance
      summary: Set an account's balance to an exact value (admin only).
      description: >
        The balance is an integer in 10^-12 token units; it may be sent as a
        JSON number or a decimal string (for values above 2^53).
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetBalanceRequest"
      responses:
        "200":
          description: The account's new balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/accounts/{account_id}/balance/adjust:
    post:
      tags: [admin]
      operationId: adjustBalance
      summary: Adjust an account's balance by a signed delta (admin only).
      description: >
        No sign restriction: negative deltas (deductions) are allowed, and the
        balance may go negative.
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdjustBalanceRequest"
      responses:
        "200":
          description: The account's new balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /admin/accounts/{account_id}/balance/events:
    get:
      tags: [admin]
      operationId: listAdminBalanceEvents
      summary: List an account's balance events, newest first (admin only).
      security:
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: List of balance events, with the acting admin's identity.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminBalanceEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /models:
    get:
      tags: [clusters]
      operationId: listModels
      summary: List the models the pool serves (public, unauthenticated).
      description: >
        Each entry includes the model slug, its exact GGUF SHA-256, the required
        memory, and whether a live cluster currently serves it. Users can use this
        to discover available models and how to refer to them in
        /chat/completions.
      responses:
        "200":
          description: List of available models.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModelInfo"

  /workers/{worker_id}/info:
    get:
      tags: [workers]
      operationId: getWorkerInfo
      summary: Public worker info (unauthenticated).
      description: >
        Deliberately minimal and anonymized: the worker id (already known to the
        caller), the model it serves, and its advertised RAM pool share. No
        account id, no endpoint/WG/IP data, no availability history — those stay
        behind auth. Future hardware stats must remain class-level (device
        class, CPU family), never instance fingerprints.
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Public worker info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerInfo"
        "404":
          $ref: "#/components/responses/NotFound"

  /clusters/{cluster_id}/info:
    get:
      tags: [clusters]
      operationId: getClusterInfo
      summary: Public cluster info (unauthenticated).
      description: >
        Deliberately minimal and anonymized: the cluster id, model, status, and
        the member list in ring order (index 0 = head) with each member's layer
        window — the "what kind of machines ran my prompt" view. No account ids,
        no WG/IP data. layer_window may be null (head has not reported a
        distribution yet) or 0 (a pure forwarder — a valid value, not "no data").
      parameters:
        - $ref: "#/components/parameters/ClusterId"
      responses:
        "200":
          description: Public cluster info.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterInfo"
        "404":
          $ref: "#/components/responses/NotFound"

  /workers/register:
    post:
      tags: [workers]
      operationId: registerWorker
      summary: Register a worker device with a worker-scoped key (joins the model's waitlist).
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWorkerRequest"
      responses:
        "201":
          description: Worker registered, waitlisted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Worker"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /workers/{worker_id}:
    delete:
      tags: [workers]
      operationId: revokeWorker
      summary: Revoke a worker (leave the waitlist / cluster).
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "204":
          description: Worker revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /workers/{worker_id}/state:
    get:
      tags: [workers]
      operationId: getWorkerState
      summary: Recover the worker's full current state (WS recovery path).
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Worker state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkerState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /workers/{worker_id}/heartbeat:
    post:
      tags: [workers]
      operationId: heartbeat
      summary: Report liveness.
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/WorkerId"
      responses:
        "200":
          description: Heartbeat acknowledged.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /clusters/{cluster_id}/config:
    get:
      tags: [clusters]
      operationId: getClusterConfig
      summary: Fetch the WireGuard cluster config (idempotent, re-pullable).
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterId"
      responses:
        "200":
          description: Cluster config.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /clusters/{cluster_id}/ready:
    post:
      tags: [clusters]
      operationId: reportReady
      summary: Report that this worker has brought up WireGuard and joined prima.cpp.
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/ClusterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportReadyRequest"
      responses:
        "202":
          description: Readiness accepted (cluster may still be assembling).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClusterStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /chat/completions:
    post:
      tags: [inference]
      operationId: chatCompletions
      summary: Proxy an OpenAI-compatible chat completion to a live cluster's head.
      description: >
        Auth: user-scoped API key. The server finds a live cluster for the requested
        model and forwards the request to the head's llama-server over the WireGuard
        tunnel (option A: the server joins the cluster WG network). Streaming (SSE)
        is supported when `stream: true`.
      security:
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, messages]
              properties:
                model: { type: string }
                messages:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string }
                      content: { type: string }
                stream: { type: boolean, default: false }
                max_tokens: { type: integer }
      responses:
        "200":
          description: Chat completion (or SSE stream).
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          description: Upstream cluster head unreachable.

  /accounts/{account_id}/usage/logs:
    get:
      tags: [accounts]
      operationId: accountUsageLogs
      summary: Return the account's inference logs in [begin, end), newest first.
      description: >
        Auth: user-scoped API key OR the account session token. `begin` and `end`
        are Unix timestamps (seconds); the range is half-open `[begin, end)`.
        Only the owning account may view its own logs.
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: begin
          in: query
          required: true
          schema: { type: number }
          description: Start of the window (Unix seconds, inclusive).
        - name: end
          in: query
          required: true
          schema: { type: number }
          description: End of the window (Unix seconds, exclusive).
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 1000, minimum: 1 }
          description: Maximum number of entries to return.
      responses:
        "200":
          description: The account's request logs in the window.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestLogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /accounts/{account_id}/usage/logs/latest:
    get:
      tags: [accounts]
      operationId: accountUsageLogsLatest
      summary: Return the account's most recent inference logs, newest first.
      description: >
        Auth: user-scoped API key OR the account session token. Returns up to
        `limit` of the account's most recent request logs, ordered by timestamp
        descending (newest first).
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1 }
          description: Maximum number of entries to return.
      responses:
        "200":
          description: The account's most recent request logs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestLogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /accounts/{account_id}/usage/stats:
    post:
      tags: [accounts]
      operationId: accountUsageStats
      summary: Aggregate the account's usage over a list of (begin, end) windows.
      description: >
        Auth: user-scoped API key OR the account session token. Takes a list of
        (begin, end) windows and returns one per-window object mapping each model
        to its {requests, prompt_tokens, completion_tokens} totals.
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageStatsRequest"
      responses:
        "200":
          description: Per-window per-model usage aggregates.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/ModelUsage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /accounts/{account_id}/worker-logs:
    get:
      tags: [accounts]
      operationId: accountWorkerLogs
      summary: Return the account's worker-attributed inference logs in [begin, end), newest first.
      description: >
        Auth: user-scoped API key OR the account session token. Each request
        served by a cluster appears once per worker the account owns in that
        cluster, with that worker's layer share and effective (share-scaled)
        token counts. `share`/`effective_*` are null when the cluster's layer
        distribution is unknown. Note: deleting a worker hard-deletes its row,
        so its historical entries disappear from this endpoint (accepted for
        now; the account-level /usage/* endpoints are unaffected).
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: begin
          in: query
          required: true
          schema: { type: number }
          description: Start of the window (Unix seconds, inclusive).
        - name: end
          in: query
          required: true
          schema: { type: number }
          description: End of the window (Unix seconds, exclusive).
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 1000, minimum: 1 }
          description: Maximum number of entries to return.
      responses:
        "200":
          description: The account's worker-attributed logs in the window.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkerLogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /accounts/{account_id}/worker-logs/latest:
    get:
      tags: [accounts]
      operationId: accountWorkerLogsLatest
      summary: Return the account's most recent worker-attributed logs, newest first.
      description: >
        Auth: user-scoped API key OR the account session token. Returns up to
        `limit` of the account's most recent worker-attributed log entries,
        ordered by timestamp descending (newest first).
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1 }
          description: Maximum number of entries to return.
      responses:
        "200":
          description: The account's most recent worker-attributed logs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkerLogEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /accounts/{account_id}/worker-stats:
    post:
      tags: [accounts]
      operationId: accountWorkerStats
      summary: Aggregate the account's worker-attributed usage over a list of (begin, end) windows.
      description: >
        Auth: user-scoped API key OR the account session token. Takes a list of
        (begin, end) windows and returns one per-window object mapping each model
        to its {total_tokens: [prompt, completion], effective_tokens: [prompt,
        completion]}. `total_tokens` sums the request token counts over the
        account's worker rows; `effective_tokens` sums the share-scaled counts.
        If `worker_ids` is given, only rows for (worker_ids ∩ owned workers) are
        included.
      security:
        - apiKeyAuth: []
        - sessionAuth: []
      parameters:
        - $ref: "#/components/parameters/AccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerStatsRequest"
      responses:
        "200":
          description: Per-window per-model worker-attributed aggregates.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    $ref: "#/components/schemas/WorkerModelUsage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    apiKeyAuth:
      type: http
      scheme: bearer
      description: Scoped API key (worker or user), e.g. `sk-worker-abc123`.
    sessionAuth:
      type: http
      scheme: bearer
      description: >
        Short-lived session token from /accounts/login, e.g. `sess_...`.
        On worker endpoints (`/workers/...`, `/clusters/.../config`,
        `/clusters/.../ready`, the WS channel), EITHER the worker-scoped API
        key OR the owning account's session token is accepted (both must own
        the target worker).
    userKeyAuth:
      type: http
      scheme: bearer
      description: >
        A user-scoped API key (`sk-user-...`), accepted alongside the session
        token on account-scoped usage/balance endpoints.
  parameters:
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^acc_[A-Za-z0-9]+$"
      description: Account ID returned at registration.
    WorkerId:
      name: worker_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^wrk_[A-Za-z0-9]+$"
    KeyId:
      name: key_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^key_[A-Za-z0-9]+$"
    ClusterId:
      name: cluster_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^clu_[A-Za-z0-9]+$"
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Invalid or missing credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Authenticated but not allowed (e.g. not a cluster member).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Rate-limited.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: State conflict (e.g. username taken).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    RegisterAccountRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password, minLength: 8, maxLength: 256 }

    Account:
      type: object
      required: [account_id, username, created_at, balance]
      properties:
        account_id: { type: string }
        username: { type: string }
        created_at:
          type: string
          format: date-time
        balance:
          type: string
          description: Account balance in 10^-12 token units (decimal string).

    AccountBalance:
      type: object
      required: [account_id, balance]
      properties:
        account_id: { type: string }
        balance:
          type: string
          description: Account balance in 10^-12 token units (decimal string).

    SetBalanceRequest:
      type: object
      required: [balance]
      properties:
        balance:
          description: >
            Exact balance in 10^-12 token units. Accepts a JSON integer or a
            decimal string (for values above 2^53).
          type: string
        reason:
          type: string
          description: Optional operator memo recorded on the event.

    AdjustBalanceRequest:
      type: object
      required: [delta]
      properties:
        delta:
          description: >
            Signed change in 10^-12 token units (negative = deduction). Accepts
            a JSON integer or a decimal string (for values above 2^53).
          type: string
        reason:
          type: string
          description: Optional operator memo recorded on the event.

    BalanceEvent:
      type: object
      required: [event_id, kind, delta, balance_after, created_at]
      properties:
        event_id: { type: string }
        kind:
          type: string
          enum: [set, adjust]
        delta:
          type: string
          description: Signed change in 10^-12 token units (decimal string).
        balance_after:
          type: string
          description: Resulting balance (decimal string).
        reason:
          type: string
        created_at:
          type: string
          format: date-time

    AdminBalanceEvent:
      allOf:
        - $ref: "#/components/schemas/BalanceEvent"
        - type: object
          required: [admin_username]
          properties:
            admin_username:
              type: string
              description: Username of the admin who performed the mutation.

    AdminAccount:
      type: object
      required: [account_id, username, is_admin, can_work, can_use, banned, effective_can_work, effective_can_use, created_at, balance]
      properties:
        account_id: { type: string }
        username: { type: string }
        is_admin: { type: boolean }
        can_work: { type: boolean }
        can_use: { type: boolean }
        banned: { type: boolean }
        effective_can_work:
          type: boolean
          description: "(not banned) and (can_work or work_permissionless)"
        effective_can_use:
          type: boolean
          description: "(not banned) and (can_use or use_permissionless)"
        created_at:
          type: string
          format: date-time
        balance:
          type: string
          description: Account balance in 10^-12 token units (decimal string).

    PermissionState:
      type: object
      required: [work_permissionless, use_permissionless]
      properties:
        work_permissionless: { type: boolean }
        use_permissionless: { type: boolean }

    UpdateAccountPermissionsRequest:
      type: object
      properties:
        is_admin: { type: boolean }
        can_work: { type: boolean }
        can_use: { type: boolean }
        banned: { type: boolean }
      description: >
        Each present field sets the account's value; absent fields are left
        untouched. At least one field must be present.

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    Session:
      type: object
      required: [session_token, expires_at]
      properties:
        session_token: { type: string }
        expires_at:
          type: string
          format: date-time

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password }

    CreateKeyRequest:
      type: object
      required: [name, scope]
      properties:
        name: { type: string }
        scope:
          type: string
          enum: [worker, user]

    ApiKey:
      type: object
      required: [key_id, name, scope, api_key, created_at]
      properties:
        key_id: { type: string }
        name: { type: string }
        scope:
          type: string
          enum: [worker, user]
        api_key:
          type: string
          description: Shown only once, at creation.
        created_at:
          type: string
          format: date-time

    ApiKeySummary:
      type: object
      required: [key_id, name, scope, created_at]
      properties:
        key_id: { type: string }
        name: { type: string }
        scope:
          type: string
          enum: [worker, user]
        created_at:
          type: string
          format: date-time

    Hardware:
      type: object
      properties:
        cpu: { type: string }
        gpu: { type: string }
        ram_gb: { type: number }
        os: { type: string }
        prima_version: { type: string }

    ModelInfo:
      type: object
      required: [slug, gguf_sha256, required_memory_mb, live]
      properties:
        slug: { type: string }
        gguf_sha256: { type: string, minLength: 64, maxLength: 64 }
        required_memory_mb: { type: integer }
        live: { type: boolean, description: A live cluster currently serves this model }

    EndpointInfo:
      type: object
      required: [host, port, behind_nat, nat_type]
      properties:
        host: { type: string, format: hostname }
        port: { type: integer, minimum: 1, maximum: 65535 }
        behind_nat: { type: boolean }
        nat_type:
          type: string
          enum: [none, cone, symmetric, unknown]

    RegisterWorkerRequest:
      type: object
      required: [model, gguf_sha256, memory_allocated_mb, wg_pubkey, endpoint]
      properties:
        model: { type: string }
        gguf_sha256:
          type: string
          minLength: 64
          maxLength: 64
          description: >
            SHA-256 of the worker's GGUF file. The server only groups workers
            whose hash matches the registered model's hash — a mismatched GGUF
            is rejected, so a cluster always runs the same model with the same
            quantization.
        memory_allocated_mb: { type: integer, minimum: 1 }
        wg_pubkey:
          type: string
          description: Device's WireGuard public key (private key never leaves the device).
        endpoint:
          $ref: "#/components/schemas/EndpointInfo"
        hardware:
          $ref: "#/components/schemas/Hardware"

    Worker:
      type: object
      required: [worker_id, account_id, status, model]
      properties:
        worker_id: { type: string }
        account_id: { type: string }
        status:
          type: string
          enum: [registered, waitlisted, assigned]
          description: >
            Registration/provisioning state. registered = exists; waitlisted = available on a
            model's waitlist; assigned = in an active cluster. Liveness is tracked separately via
            `online`.
        model: { type: string }
        waitlist_position:
          type: integer
          description: >
            Reserved field, always null in v0 — the server does not compute
            waitlist positions. Retained in the schema for forward compatibility.
        online:
          type: boolean
          description: >
            Liveness flag, orthogonal to status. false = removed from the waitlist until the
            next heartbeat; the key and worker_id remain valid.

    WorkerState:
      type: object
      required: [worker_id, account_id, status, model]
      properties:
        worker_id: { type: string }
        account_id: { type: string }
        status:
          type: string
          enum: [registered, waitlisted, assigned]
          description: >
            Same enum as Worker.status; `ready`/`active` are not worker states. Liveness is
            `online`; cluster readiness is the cluster's own status.
        online:
          type: boolean
          description: Liveness flag; false means the worker is down (out of the waitlist).
        model: { type: string }
        cluster:
          $ref: "#/components/schemas/ClusterAssignment"

    WorkerInfo:
      type: object
      required: [worker_id, model, memory_allocated_mb]
      description: >
        Public worker info (unauthenticated). Deliberately minimal and anonymized:
        worker id, model, and advertised RAM pool share only. No account id, no
        endpoint/WG/IP data, no availability history. Future hardware stats must
        remain class-level (device class, CPU family) — never instance
        fingerprints (exact CPU model strings, OS versions).
      properties:
        worker_id: { type: string }
        model: { type: string }
        memory_allocated_mb:
          type: integer
          description: >
            Advertised RAM pool share, set at registration and updated on
            re-registration of the same device. A stable capacity signal, NOT
            live free RAM (which would leak availability patterns).

    ClusterMemberInfo:
      type: object
      required: [worker_id]
      properties:
        worker_id: { type: string, description: Opaque random id; no owner, no endpoint. }
        layer_window:
          type: integer
          nullable: true
          description: >
            Number of model layers this worker runs. null = head has not reported a
            distribution yet; 0 = pure forwarder (a valid value, not "no data").

    ClusterInfo:
      type: object
      required: [cluster_id, model, status, members]
      description: >
        Public cluster info (unauthenticated). Deliberately minimal and anonymized:
        cluster id, model, status, and the member list in ring order (index 0 =
        head) with each member's layer window. No account ids, no WG/IP data.
      properties:
        cluster_id: { type: string }
        model: { type: string }
        status:
          type: string
          enum: [assembling, live, terminated]
        members:
          type: array
          description: Members in ring order (index 0 = head).
          items:
            $ref: "#/components/schemas/ClusterMemberInfo"

    ClusterAssignment:
      type: object
      properties:
        cluster_id: { type: string }
        assigned_ip: { type: string }
        config_url: { type: string, format: uri }

    ClusterConfig:
      type: object
      required: [cluster_id, interface, peers]
      properties:
        cluster_id: { type: string }
        interface:
          type: object
          required: [private_ip, subnet]
          properties:
            private_ip: { type: string }
            subnet: { type: string }
            mtu:
              type: integer
              default: 1280
              description: >
                WireGuard MTU. Defaults to 1280 (safe IPv6 minimum) to avoid fragmentation over
                NAT/relay links; the server may set a different value per cluster.
        relay:
          type: object
          properties:
            pubkey: { type: string }
            endpoint: { type: string }
            enabled: { type: boolean, default: false }
        peers:
          type: array
          description: >
            Ordered list of cluster members — this is the prima.cpp ring. Array order is
            significant: index 0 is the ring head, and each member's ring position is its index.
            All members MUST agree on this order; the server is authoritative.
          items:
            $ref: "#/components/schemas/PeerConfig"

    PeerConfig:
      type: object
      required: [pubkey, allowed_ips]
      properties:
        pubkey: { type: string }
        endpoint: { type: string }
        allowed_ips:
          type: array
          items: { type: string }
        persistent_keepalive: { type: integer, default: 25 }
        preferred:
          type: string
          enum: [direct, relay]
          default: direct
        role:
          type: string
          enum: [server]
          description: >
            Optional role marker. `server` = the control plane (NOT a ring member);
            clients MUST exclude server peers from ring topology computation.

    ReportReadyRequest:
      type: object
      description: >
        Readiness report. The caller is identified by the worker-scoped API key.
        `layer_windows` is OPTIONAL and only meaningful from the head (rank 0):
        it carries the per-rank layer distribution computed by prima.cpp
        (Halda/HiGHS) so the server can record it even if the WS distribution
        frame was lost. An empty object `{}` means "distribution unknown"
        (parse failure) and still satisfies the liveness gate. Workers leave it
        unset.
      properties:
        layer_windows:
          type: object
          description: >
            Rank -> layer count, keyed by ring position (Device Index). Only
            the head reports it. The server maps rank -> worker_id via the
            cluster's member order.
          additionalProperties:
            type: integer
            minimum: 0

    ClusterStatus:
      type: object
      required: [cluster_id, status]
      properties:
        cluster_id: { type: string }
        status:
          type: string
          enum: [assembling, live, terminated]
        members_ready: { type: integer }
        members_total: { type: integer }

    RequestLogEntry:
      type: object
      required: [request_id, model, cluster_id, prompt_tokens, completion_tokens, created_at]
      properties:
        request_id: { type: string }
        model: { type: string }
        cluster_id: { type: string }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        created_at: { type: number, description: Unix timestamp (seconds) }

    UsageStatsRequest:
      type: object
      required: [windows]
      properties:
        windows:
          type: array
          description: List of (begin, end) Unix-second windows.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }

    ModelUsage:
      type: object
      required: [requests, prompt_tokens, completion_tokens]
      properties:
        requests: { type: integer }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }

    WorkerLogEntry:
      type: object
      required: [request_id, worker_id, model, cluster_id, prompt_tokens, completion_tokens, created_at]
      properties:
        request_id: { type: string }
        worker_id: { type: string }
        model: { type: string }
        cluster_id: { type: string }
        prompt_tokens: { type: integer }
        completion_tokens: { type: integer }
        share:
          type: number
          nullable: true
          description: >
            The worker's layer share (layer_window / total layers across the
            whole cluster). Null when the distribution is unknown. 0 for a
            forwarder.
        effective_prompt:
          type: number
          nullable: true
          description: prompt_tokens * share (null when share is null).
        effective_completion:
          type: number
          nullable: true
          description: completion_tokens * share (null when share is null).
        created_at: { type: number, description: Unix timestamp (seconds) }

    WorkerStatsRequest:
      type: object
      required: [windows]
      properties:
        windows:
          type: array
          description: List of (begin, end) Unix-second windows.
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number }
        worker_ids:
          type: array
          nullable: true
          description: >
            Optional worker filter, intersected with the account's owned
            workers. Empty/omitted = all owned workers.
          items: { type: string }

    WorkerModelUsage:
      type: object
      required: [total_tokens, effective_tokens]
      properties:
        total_tokens:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: "[prompt, completion] summed over the account's worker rows."
        effective_tokens:
          type: array
          minItems: 2
          maxItems: 2
          items: { type: number }
          description: "[prompt, completion] share-scaled, summed over the account's worker rows."
